# Port
server.port=${PORT:8080}

# Base de donnees PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-d6auihpr0fns73fdidn0-a.frankfurt-postgres.render.com:5432/medicaments}
spring.datasource.username=${DATABASE_USERNAME:medicaments_user}
spring.datasource.password=${DATABASE_PASSWORD:NyPs4R6DDOWEVbPJs95FMXn6gLeGDisS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Ressources statiques
spring.web.resources.static-locations=classpath:/static/,file:/tmp

# Affichage des erreurs
server.error.whitelabel.enabled=true

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Configuration JSON
spring.data.rest.defaultMediaType=application/json
spring.jackson.serialization.indent-output=true

# Base path de l'API REST
spring.data.rest.base-path=api

# Proxy Render
server.forward-headers-strategy=native

# Logs
server.error.include-stacktrace=never
logging.level.web=DEBUG
spring.mvc.log-request-details=true
logging.level.org.springframework=INFO
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.show-sql=false
logging.level.org.hibernate.type=ERROR
logging.level.pharmacie=DEBUG
logging.pattern.console=%clr(%-5p)  %cyan(%logger{15}) - %msg %n

# Upload de fichiers
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

