# Port
server.port=${PORT:8080}

# Encodage
spring.sql.init.encoding=UTF-8

# --- CONFIGURATION BASE DE DONNEES (SÉCURISÉE) ---
# Ici on utilise les variables que Render va injecter
spring.datasource.url=${JDBC_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate et JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CONFIGURATION POSTMARK (SÉCURISÉE) ---
postmark.api.token=${POSTMARK_API_TOKEN}
postmark.sender.email=lina.ouazzani_chahdi@etud.univ-jfc.fr

# --- AUTRES RÉGLAGES ---
spring.web.resources.static-locations=classpath:/static/,file:/tmp
server.error.whitelabel.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.data.rest.defaultMediaType=application/json
spring.jackson.serialization.indent-output=true
spring.data.rest.base-path=api
server.forward-headers-strategy=native

# Logs
server.error.include-stacktrace=never
logging.level.web=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%clr(%-5p)  %cyan(%logger{15}) - %msg %n

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true