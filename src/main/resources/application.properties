# Le port sur lequel est lancee l'application web
server.port=${PORT:8080}

# Encodage des scripts sql d'initialisation de la BD
spring.sql.init.encoding=UTF-8

# Base de donnees PostgreSQL via variable d'environnement
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Ressources statiques
spring.web.resources.static-locations=classpath:/static/,file:/tmp

# Affichage des erreurs
server.error.whitelabel.enabled=true

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Configuration JSON
spring.data.rest.defaultMediaType=application/json
spring.jackson.serialization.indent-output=true

# Base path de l'API REST
spring.data.rest.base-path=api

# Proxy
server.forward-headers-strategy=native

# Logs
server.error.include-stacktrace=never
logging.level.web=DEBUG
spring.mvc.log-request-details=true
logging.level.org.springframework=INFO
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.show-sql=false
logging.level.org.hibernate.type=ERROR
logging.level.pharmacie=DEBUG
logging.pattern.console=%clr(%-5p)  %cyan(%logger{15}) - %msg %n

# Upload de fichiers
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Postmark via variable d'environnement
postmark.api.token=${POSTMARK_API_TOKEN}
postmark.sender.email=lina.ouazzani_chahdi@etud.univ-jfc.fr